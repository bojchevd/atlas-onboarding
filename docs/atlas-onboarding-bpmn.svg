<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" width="1120" height="700" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">

  <defs>
    <marker id="seqArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="msgArrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10" fill="none" stroke="#64748b" stroke-width="1.4"/>
    </marker>
    <marker id="msgStart" viewBox="0 0 8 8" refX="4" refY="4"
            markerWidth="6" markerHeight="6">
      <circle cx="4" cy="4" r="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
    </marker>

    <g id="gearIcon">
      <circle cx="0" cy="0" r="5.2" fill="none" stroke="#334155" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="1.9" fill="none" stroke="#334155" stroke-width="1.3"/>
      <rect x="-1" y="-8" width="2" height="2.6" fill="#334155"/>
      <rect x="-1" y="5.4" width="2" height="2.6" fill="#334155"/>
      <rect x="-8" y="-1" width="2.6" height="2" fill="#334155"/>
      <rect x="5.4" y="-1" width="2.6" height="2" fill="#334155"/>
    </g>

    <g id="userIcon">
      <circle cx="0" cy="-3.4" r="2.9" fill="none" stroke="#92400e" stroke-width="1.5"/>
      <path d="M -5.6 6.4 a 5.6 5.6 0 0 1 11.2 0" fill="none" stroke="#92400e" stroke-width="1.5"/>
    </g>

    <g id="envelope">
      <rect x="-6" y="-4.2" width="12" height="8.4" fill="none" stroke="#334155" stroke-width="1.4"/>
      <path d="M -6 -4.2 L 0 0.6 L 6 -4.2" fill="none" stroke="#334155" stroke-width="1.4"/>
    </g>
  </defs>

  <rect width="1120" height="700" fill="#ffffff"/>

  <text x="20" y="18" font-size="13" font-weight="600" fill="#0f172a">
    Atlas — digital onboarding, as designed
  </text>

  <!-- ══════════ MOBILE (collapsed pool) ══════════ -->
  <rect x="20" y="30" width="460" height="44" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <rect x="20" y="30" width="26" height="44" fill="#f1f5f9" stroke="#334155" stroke-width="1.6"/>
  <text x="33" y="52" font-size="10" font-weight="600" fill="#0f172a"
        text-anchor="middle" transform="rotate(-90 33 52)">Mobile</text>
  <text x="263" y="57" font-size="12" fill="#475569" text-anchor="middle">Mobile app</text>

  <!-- ══════════ LEGEND ══════════ -->
  <g transform="translate(740 26)">
    <rect x="0" y="0" width="350" height="70" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="12" y="17" font-size="9.5" font-weight="700" fill="#334155">NOTATION</text>
    <g transform="translate(22 34)"><use href="#gearIcon"/></g>
    <text x="36" y="38" font-size="9" fill="#475569">service task</text>
    <g transform="translate(22 55) scale(0.85)"><use href="#userIcon"/></g>
    <text x="36" y="58" font-size="9" fill="#475569">user task (human)</text>
    <line x1="140" y1="34" x2="158" y2="34" stroke="#64748b" stroke-width="1.4" stroke-dasharray="5 3"/>
    <text x="164" y="38" font-size="9" fill="#475569">message flow</text>
    <g transform="translate(149 55)">
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
      <circle cx="0" cy="0" r="6" fill="none" stroke="#334155" stroke-width="1.2"/>
    </g>
    <text x="164" y="58" font-size="9" fill="#475569">message sent / received</text>
    <g transform="translate(275 34)">
      <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#15803d" stroke-width="3"/>
    </g>
    <text x="289" y="38" font-size="9" fill="#475569">end event</text>
    <path d="M 275 48 L 285 58 L 275 68 L 265 58 Z" fill="#ffffff" stroke="#334155" stroke-width="1.4"/>
    <path d="M 271 54 L 279 62 M 279 54 L 271 62" stroke="#334155" stroke-width="1.3"/>
    <text x="289" y="62" font-size="9" fill="#475569">exclusive gateway</text>
  </g>

  <!-- ══════════ ATLAS ONBOARDING POOL ══════════ -->
  <rect x="20" y="110" width="1070" height="310" fill="none" stroke="#334155" stroke-width="1.8"/>
  <rect x="20" y="110" width="26" height="310" fill="#f1f5f9" stroke="#334155" stroke-width="1.8"/>
  <text x="33" y="265" font-size="10.5" font-weight="700" fill="#0f172a"
        text-anchor="middle" transform="rotate(-90 33 265)">ATLAS ONBOARDING</text>

  <line x1="46" y1="285" x2="1090" y2="285" stroke="#334155" stroke-width="1.4"/>

  <rect x="46" y="110" width="24" height="175" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <text x="58" y="197" font-size="9.5" font-weight="600" fill="#334155"
        text-anchor="middle" transform="rotate(-90 58 197)">Onboarding service</text>

  <rect x="46" y="285" width="24" height="135" fill="#fffbeb" stroke="#334155" stroke-width="1.2"/>
  <text x="58" y="352" font-size="9.5" font-weight="600" fill="#92400e"
        text-anchor="middle" transform="rotate(-90 58 352)">Compliance officer</text>

  <!-- ══════════ ATLAS VERIFICATION POOL ══════════ -->
  <rect x="20" y="460" width="1070" height="140" fill="none" stroke="#334155" stroke-width="1.8"/>
  <rect x="20" y="460" width="26" height="140" fill="#eff6ff" stroke="#334155" stroke-width="1.8"/>
  <text x="33" y="530" font-size="10.5" font-weight="700" fill="#1e3a8a"
        text-anchor="middle" transform="rotate(-90 33 530)">VERIFICATION</text>

  <!-- ══════════ PROVIDER POOLS (collapsed) ══════════ -->
  <rect x="480" y="630" width="140" height="44" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="550" y="657" font-size="12" fill="#475569" text-anchor="middle">IDNow</text>

  <rect x="655" y="630" width="150" height="44" fill="#f8fafc" stroke="#334155" stroke-width="1.6"/>
  <text x="730" y="657" font-size="12" fill="#475569" text-anchor="middle">World-Check</text>

  <!-- ══════════ SEQUENCE FLOWS ══════════ -->
  <g stroke="#334155" stroke-width="1.6" fill="none" marker-end="url(#seqArrow)">
    <path d="M 109 180 L 130 180"/>
    <path d="M 254 180 L 265 180"/>
    <path d="M 313 180 L 326 180"/>
    <path d="M 460 180 L 498 180"/>
    <path d="M 538 180 L 575 180"/>
    <path d="M 623 180 L 696 180"/>
    <path d="M 820 180 L 851 180"/>
    <path d="M 975 180 L 987 180"/>
    <path d="M 290 203 L 290 231"/>
    <path d="M 600 203 L 600 306"/>
    <path d="M 675 342 L 715 342"/>
    <path d="M 763 342 L 790 342 L 790 216"/>
    <path d="M 740 365 L 740 376"/>
    <path d="M 457 530 L 476 530"/>
    <path d="M 620 530 L 651 530"/>
    <path d="M 805 530 L 830 530"/>
  </g>

  <text x="296" y="222" font-size="9.5" fill="#b91c1c">no</text>
  <text x="640" y="174" font-size="9.5" fill="#475569">clear</text>
  <text x="608" y="250" font-size="9.5" fill="#92400e">possible match</text>
  <text x="796" y="262" font-size="9.5" fill="#15803d">approved</text>
  <text x="750" y="376" font-size="9.5" fill="#b91c1c">rejected</text>

  <!-- ══════════ MESSAGE FLOWS ══════════ -->
  <g stroke="#64748b" stroke-width="1.4" fill="none"
     stroke-dasharray="6 4" marker-end="url(#msgArrow)" marker-start="url(#msgStart)">
    <path d="M 92 74 L 92 161"/>
    <path d="M 395 146 L 395 74"/>
    <path d="M 440 214 L 440 511"/>
    <path d="M 850 512 L 850 437 L 520 437 L 520 200"/>
    <path d="M 550 564 L 550 630"/>
    <path d="M 730 564 L 730 630"/>
  </g>
  <text x="100" y="118" font-size="9.5" fill="#64748b">submit</text>
  <text x="403" y="100" font-size="9.5" fill="#1d4ed8" font-weight="600">202 Accepted</text>
  <text x="448" y="300" font-size="9" fill="#64748b">VerificationRequested</text>
  <text x="560" y="432" font-size="9" fill="#64748b">VerificationCompleted</text>

  <!-- ══════════ ONBOARDING LANE ══════════ -->

  <circle cx="92" cy="180" r="17" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <g transform="translate(92 180)"><use href="#envelope"/></g>
  <text x="92" y="224" font-size="10" fill="#475569" text-anchor="middle">Submission</text>
  <text x="92" y="235" font-size="10" fill="#475569" text-anchor="middle">received</text>

  <rect x="134" y="146" width="120" height="68" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <g transform="translate(148 160)"><use href="#gearIcon"/></g>
  <text x="194" y="182" font-size="11.5" fill="#0f172a" text-anchor="middle">Validate against</text>
  <text x="194" y="196" font-size="11.5" fill="#0f172a" text-anchor="middle">market rules</text>

  <path d="M 290 157 L 313 180 L 290 203 L 267 180 Z" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <path d="M 283 173 L 297 187 M 297 173 L 283 187" stroke="#334155" stroke-width="1.8" fill="none"/>
  <text x="290" y="143" font-size="10.5" fill="#475569" text-anchor="middle">Valid?</text>

  <rect x="328" y="146" width="132" height="68" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="2"/>
  <g transform="translate(342 160)"><use href="#gearIcon"/></g>
  <text x="394" y="182" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">Accept</text>
  <text x="394" y="196" font-size="11.5" fill="#0f172a" text-anchor="middle" font-weight="600">submission</text>

  <circle cx="520" cy="180" r="18" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <circle cx="520" cy="180" r="14" fill="none" stroke="#334155" stroke-width="1.5"/>
  <g transform="translate(520 180) scale(0.8)"><use href="#envelope"/></g>

  <path d="M 600 157 L 623 180 L 600 203 L 577 180 Z" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <path d="M 593 173 L 607 187 M 607 173 L 593 187" stroke="#334155" stroke-width="1.8" fill="none"/>
  <text x="600" y="143" font-size="10.5" fill="#475569" text-anchor="middle">Screening result?</text>

  <rect x="696" y="146" width="124" height="68" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <g transform="translate(710 160)"><use href="#gearIcon"/></g>
  <text x="758" y="188" font-size="11.5" fill="#0f172a" text-anchor="middle">Approve</text>
  <text x="758" y="202" font-size="11.5" fill="#0f172a" text-anchor="middle">application</text>

  <rect x="851" y="146" width="124" height="68" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <g transform="translate(865 160)"><use href="#gearIcon"/></g>
  <text x="913" y="188" font-size="11.5" fill="#0f172a" text-anchor="middle">Activate</text>
  <text x="913" y="202" font-size="11.5" fill="#0f172a" text-anchor="middle">account</text>

  <circle cx="1006" cy="180" r="19" fill="#ffffff" stroke="#15803d" stroke-width="4"/>
  <text x="1006" y="224" font-size="10" fill="#15803d" text-anchor="middle" font-weight="600">Account</text>
  <text x="1006" y="235" font-size="10" fill="#15803d" text-anchor="middle" font-weight="600">open</text>

  <circle cx="290" cy="248" r="17" fill="#ffffff" stroke="#b91c1c" stroke-width="4"/>
  <text x="266" y="252" font-size="10" fill="#b91c1c" text-anchor="end">Rejected</text>

  <!-- ══════════ COMPLIANCE LANE ══════════ -->

  <rect x="535" y="310" width="140" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <g transform="translate(550 325)"><use href="#userIcon"/></g>
  <text x="605" y="347" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="600">Review possible</text>
  <text x="605" y="361" font-size="11.5" fill="#78350f" text-anchor="middle" font-weight="600">match</text>

  <path d="M 740 319 L 763 342 L 740 365 L 717 342 Z" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <path d="M 733 335 L 747 349 M 747 335 L 733 349" stroke="#334155" stroke-width="1.8" fill="none"/>
  <text x="740" y="311" font-size="10.5" fill="#475569" text-anchor="middle">Decision?</text>

  <circle cx="740" cy="393" r="17" fill="#ffffff" stroke="#b91c1c" stroke-width="4"/>
  <text x="775" y="397" font-size="10" fill="#b91c1c">Rejected</text>

  <!-- ══════════ VERIFICATION POOL ══════════ -->

  <circle cx="440" cy="530" r="17" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <g transform="translate(440 530)"><use href="#envelope"/></g>

  <rect x="476" y="496" width="144" height="68" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <g transform="translate(490 510)"><use href="#gearIcon"/></g>
  <text x="548" y="532" font-size="11.5" fill="#0f172a" text-anchor="middle">Verify identity</text>
  <text x="548" y="546" font-size="11.5" fill="#0f172a" text-anchor="middle">document</text>

  <rect x="651" y="496" width="154" height="68" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.8"/>
  <g transform="translate(665 510)"><use href="#gearIcon"/></g>
  <text x="728" y="532" font-size="11.5" fill="#0f172a" text-anchor="middle">Screen for sanctions</text>
  <text x="728" y="546" font-size="11.5" fill="#0f172a" text-anchor="middle">and PEP</text>

  <circle cx="850" cy="530" r="18" fill="#ffffff" stroke="#334155" stroke-width="4"/>
  <g transform="translate(850 530) scale(0.78)">
    <rect x="-6" y="-4.2" width="12" height="8.4" fill="#334155"/>
    <path d="M -6 -4.2 L 0 0.6 L 6 -4.2" fill="none" stroke="#ffffff" stroke-width="1.8"/>
  </g>
  <text x="850" y="572" font-size="10" fill="#475569" text-anchor="middle">Result published</text>

  <!-- ══════════ ANNOTATIONS ══════════ -->

  <!-- compliance -->
  <path d="M 420 316 L 412 316 L 412 368 L 420 368" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <path d="M 420 342 L 533 342" stroke="#94a3b8" stroke-width="1.1" stroke-dasharray="3 3" fill="none"/>
  <text x="406" y="320" font-size="9.5" fill="#92400e" text-anchor="end">GC-2026-0814 §3 — a compliance officer in</text>
  <text x="406" y="332" font-size="9.5" fill="#92400e" text-anchor="end">the relevant market. Up to 48 hours.</text>
  <text x="406" y="344" font-size="9.5" fill="#92400e" text-anchor="end">No automated transition leaves this state.</text>
  <text x="406" y="356" font-size="9.5" fill="#92400e" text-anchor="end">What happens if 48 hours passes is an</text>
  <text x="406" y="368" font-size="9.5" fill="#92400e" text-anchor="end">open question, not a decision I made.</text>

  <!-- mobile steps -->
  <path d="M 120 100 L 112 100 L 112 78 L 120 78" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="126" y="90" font-size="9.5" fill="#475569">Mobile collects details, ID photo, selfie and terms.</text>
  <text x="126" y="102" font-size="9.5" fill="#475569">Documents are uploaded separately, referenced here.</text>

</svg>
